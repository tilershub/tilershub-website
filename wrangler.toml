name = "tilershub"
compatibility_date = "2024-01-01"

main = "./dist/_worker.js/index.js"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Set ANTHROPIC_API_KEY in the Cloudflare dashboard:
#   Workers & Pages → tilershub → Settings → Variables and Secrets
#   Variable name: ANTHROPIC_API_KEY
#   For local dev: add to .env file as ANTHROPIC_API_KEY=sk-ant-...
